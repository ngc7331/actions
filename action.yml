name: update-check
inputs:
  cmd:
    required: true
  tag:
    required: true
  desp:
    required: false
    default: ""
  env:
    required: false
    default: ""
  local_mode:
    required: false
    default: "file" # file, submodule
  version_file:
    required: false
    default: "README.md" # file path or submodule dir
  git_commit:
    required: false
    default: "false"
  git_user:
    required: false
    default: ""
  git_email:
    required: false
    default: ""

outputs:
  update:
    description: "Update available"
    value: ${{ steps.check.outputs.update }}

runs:
  using: "composite"
  steps:
    - name: Verify config
      shell: bash
      run: |
        if [ "${{ inputs.local_mode }}" == "file" ]; then
          if [ ! -f "${{ inputs.version_file }}" ]; then
            echo "version_file not found: ${{ inputs.version_file }}"
            exit 1
          fi
        elif [ "${{ inputs.local_mode }}" == "submodule" ]; then
          if [ ! -d "${{ inputs.version_file }}" ] || [ -z "$(git submodule status | grep ${{ inputs.version_file }})" ]; then
            echo "submodule not found: ${{ inputs.version_file }}"
            exit 1
          fi
        else
          echo "local_mode must be 'file' or 'submodule', got ${{ inputs.local_mode }}"
          exit 1
        fi

        if [ "${{ inputs.git_commit }}" == "true" ]; then
          if [ -z "${{ inputs.git_user }}" ]; then
            echo "git_user must be set when git_commit is true"
            exit 1
          fi
          if [ -z "${{ inputs.git_email }}" ]; then
            echo "git_email must be set when git_commit is true"
            exit 1
          fi
        fi

    - name: Check update
      id: check
      shell: bash
      run: |
        if [ -z "${{ inputs.desp }}" ]; then
          export desp=${{ inputs.tag }}
        else
          export desp=${{ inputs.desp }}
        fi

        for env in $(echo ${{ inputs.env }} | tr "," "\n"); do
          export $env
        done

        export version=$(eval ${{ inputs.cmd }})
        if [ "${{ inputs.local_mode }}" == "submodule" ]; then
          cd ${{ inputs.version_file }} && git fetch --tags && cd ..
          export local_version=$(cd ${{ inputs.version_file }} && git describe --tags --abbrev=0)
        else # if [ "${{ inputs.local_mode }}" == "file" ]
          export local_version=$(grep -oP "(?<=${{ inputs.tag }}: ).*" ${{ inputs.version_file }})
        fi

        if [ "$version" != "$local_version" ]; then
          echo "Update available: $local_version -> $version"

          if [ "${{ inputs.local_mode }}" == "submodule" ]; then
            echo "Update submodule..."
            cd ${{ inputs.version_file }} && git checkout $version && cd ..
          else # if [ "${{ inputs.local_mode }}" == "file" ]
            echo "Update version file..."
            sed -i "s/${{ inputs.tag }}: $local_version/${{ inputs.tag }}: $version/" ${{ inputs.version_file }}
          fi

          if [ "${{ inputs.git_commit }}" == "true" ]; then
            echo "Commit changes..."
            git config --global user.email "${{ inputs.git_email }}"
            git config --global user.name "${{ inputs.git_user }}"
            git add ${{ inputs.version_file }}
            git commit -m "[BOT] Update $desp to $version"
            git push
          fi
          echo update=true >> $GITHUB_OUTPUT
        else
          echo "No update available: $local_version"
          echo update=false >> $GITHUB_OUTPUT
        fi
